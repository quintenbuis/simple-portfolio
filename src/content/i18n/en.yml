about:
  heading: What I do
  # An empty line starts a new paragraph. {years} = years of experience (automatic, see careerStartYear in src/config.ts).
  text: >-
    I'm Quinten Buis, a freelance senior full-stack developer with over {years} years of
    experience designing, building and maintaining software. I work remotely for clients
    across the Netherlands and I'm available for freelance projects.

    My focus is on custom applications, built with PHP (Laravel
    and Symfony), Go and TypeScript (Vue, React and Next.js). I also build integrations
    and APIs between systems such as ERP, CRM, payment and logistics providers, so data
    flows reliably and automatically between applications.

    I'm just as comfortable on the infrastructure side: I containerise applications with
    Docker, deploy them to Kubernetes and manage environments on Google Cloud (GCP) or a
    VPS, using Terraform as infrastructure as code.

    I work pragmatically and carefully: readable code, solid tests and clear
    communication. Have a new product, an integration that could be better or an
    application that needs to move to the cloud? Feel free to get in touch.
  techHeading: Technologies
services:
  heading: Services
  items:
    - title: Custom applications
      text: >-
        Applications tailored to your processes, from a first version to further
        development of an existing system. Built with Laravel, Symfony, Go and modern frontends.
    - title: Integrations & APIs
      text: >-
        Reliable integrations between systems such as ERP, CRM, payment and logistics
        providers, and well-documented APIs for your own platform.
    - title: Cloud & DevOps
      text: >-
        Containerising applications, deploying them to Kubernetes or a VPS and
        capturing infrastructure in Terraform, including CI/CD and monitoring.
