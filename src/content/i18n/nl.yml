about:
  heading: Wat ik doe
  # Een lege regel begint een nieuwe alinea.
  text: >-
    Ik ben Quinten Buis, freelance senior full-stack developer, en ik ontwerp, bouw en
    onderhoud sinds 2020 software. Ik werk remote voor
    opdrachtgevers in heel Nederland en ben beschikbaar voor freelance opdrachten.

    Mijn focus ligt op maatwerk webapplicaties en SaaS-platformen, gebouwd met PHP
    (Laravel en Symfony), Go en TypeScript (Vue, React en Next.js). Daarnaast realiseer
    ik koppelingen en API's tussen systemen, zoals ERP, CRM en betaal- of logistieke
    partijen, zodat data betrouwbaar en automatisch tussen applicaties stroomt.

    Ook aan de infrastructuurkant voel ik me thuis: ik containeriseer applicaties met
    Docker, rol ze uit op Kubernetes en beheer omgevingen op Google Cloud (GCP) of een
    VPS, met Terraform als infrastructure-as-code.

    Ik werk pragmatisch en zorgvuldig: leesbare code, goede tests en heldere
    communicatie. Heb je een nieuw product, een koppeling die beter kan of een
    applicatie die naar de cloud moet? Neem gerust contact op.
  techHeading: Technologieën
services:
  heading: Diensten
  items:
    - title: Webapplicaties & SaaS
      text: >-
        Maatwerk webapplicaties en SaaS-platformen, van eerste MVP tot doorontwikkeling
        van een bestaand product. Gebouwd met Laravel, Symfony, Go en moderne frontends.
    - title: Koppelingen & API's
      text: >-
        Betrouwbare integraties tussen systemen zoals ERP, CRM en betaal- of logistieke
        partijen, en goed gedocumenteerde API's voor je eigen platform.
    - title: Cloud & DevOps
      text: >-
        Applicaties containeriseren, uitrollen op Kubernetes of een VPS en
        infrastructuur vastleggen met Terraform, inclusief CI/CD en monitoring.
